# Метки типа задачи: `setup` создаёт их в репозитории и сверяет имя, цвет и описание.
# У каждого шаблона в ISSUE_TEMPLATE/ — своя метка отсюда. Формат читается без библиотеки, но остаётся валидным YAML:
# «- name:», затем «  ключ: значение»; значение с «: » или «#» — в двойных кавычках, без \" и \\ внутри.
- name: type:task
  color: 0E8A16
  description: "Тип: задача — изменение с решением и PR"
- name: type:bug
  color: D73A4A
  description: "Тип: баг — работает не так, как должно"
- name: type:research
  color: 5319E7
  description: "Тип: исследование — ответ с доказательством, без PR"
- name: type:epic
  color: B60205
  description: "Тип: эпик — тема из нескольких задач, своего PR нет"
